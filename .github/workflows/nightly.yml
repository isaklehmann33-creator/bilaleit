name: Uppfæra bíla

on:
  schedule:
    - cron: "0 4 * * *"   # kl. 04:00 á hverri nóttu (Ísland = UTC)
  workflow_dispatch:       # "Run workflow" takki á GitHub
    inputs:
      details_minutes:
        description: "Mínútur til að sækja lýsingar (35 á nóttu; hærra til að ná upp)"
        default: "35"
      vision_minutes:
        description: "Mínútur fyrir myndgreiningu (40 á nóttu)"
        default: "40"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      FB_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BILALEIT }}   # tómt þar til lykillinn er settur inn; þá birtist síðan sjálf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sækja auglýsingar
        run: python3 scrape.py
        env:
          DETAILS_BUDGET_MIN: ${{ github.event.inputs.details_minutes || '35' }}
      - name: Skyndiminni fyrir myndgreiningarlíkan
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: vision-clip-v1
      - name: Ástandsmat út frá myndum (CLIP)
        continue-on-error: true
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers pillow
          python3 vision.py
        env:
          VISION_BUDGET_MIN: ${{ github.event.inputs.vision_minutes || '40' }}
      - name: Sami bíll á fleiri stöðum (myndafingraför)
        continue-on-error: true
        run: |
          pip install -q pillow
          python3 dupes.py
      - name: Vista gögn í git
        run: |
          git config user.name "bilaleit-bot"
          git config user.email "bilaleit-bot@users.noreply.github.com"
          git add public/data/details public/data/vision.json vision_cache.json public/data/cars.json public/data/history.json public/data/sold.json public/data/catalog.json public/data/places.json public/data/registry.json public/data/dupes.json phash_cache.json dealers.json dealer_addresses.json geo_cache.json bland_cache.json
          git diff --cached --quiet || git commit -m "Uppfærð bílagögn $(date -u +%F)"
          git pull --rebase -q && git push
      - name: Gerðarsíður (/verd/) fyrir birtingu
        if: env.FB_KEY != ''
        run: |
          V=$(date +%s)
          echo "{\"v\":\"$V\"}" > public/version.json
          sed -i "s/window.APP_VERSION = '[0-9]*'/window.APP_VERSION = '$V'/" public/firebase-config.js
          node pages.js
      - name: Birta á bilaleit.web.app
        if: env.FB_KEY != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BILALEIT }}
          channelId: live
          projectId: bilaleit
